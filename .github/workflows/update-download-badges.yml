name: Update profile totals

# Tallies downloads, stars and forks across the public repos of johanbeytell1
# and Infinitode, and rewrites the TOTAL-DOWNLOADS badge block in
# profile/README.md. Repos are discovered automatically; nothing is listed by hand.
# No personal access tokens are needed.
#
# Data sources (see scripts/update-download-badges.py for details):
#   Stars, forks  - GitHub repo listing (exact, all-time).
#   PyPI          - packages that belong to a repo (verified by a link back to
#                   the repo or by the repo's packaging file). Rounded shields.io
#                   figures by default; set PEPY_API_KEY for exact counts.
#   jsDelivr      - shields.io /jsdelivr/gh/hy badge for every repo; hits over
#                   the last 12 months (there is no all-time jsDelivr figure).
#
# Safety: a failed fetch never overwrites the published numbers. The job only
# writes when the repo listing succeeded and at least one download source
# returned a number. Download totals are never published more than 5% below the
# figure already shown.

on:
  schedule:
    - cron: "17 4 * * *" # 04:17 UTC daily
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/**"
      - ".github/workflows/update-download-badges.yml"
  push:
    branches: [main]
    paths:
      - "scripts/update-download-badges.py"
      - ".github/workflows/update-download-badges.yml"

permissions:
  contents: write

concurrency:
  group: download-badges
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the badge tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      # Pull requests only run the tests above; the badges are rewritten on main.
      - name: Tally totals and rewrite the badges
        if: github.event_name != 'pull_request'
        env:
          # Built into every workflow run; only used to raise the GitHub rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional. Without it PyPI counts are rounded shields.io figures.
          PEPY_API_KEY: ${{ secrets.PEPY_API_KEY }}
        run: |
          if [ -z "$PEPY_API_KEY" ]; then
            echo "::notice::PEPY_API_KEY is not set; PyPI counts will be rounded shields.io figures."
          fi
          python3 scripts/update-download-badges.py --readme profile/README.md

      - name: Commit the updated badges
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/README.md
          if git diff --cached --quiet; then
            echo "Totals unchanged; nothing to commit."
          else
            git commit -m "chore: update profile totals [skip ci]"
            git push
          fi
