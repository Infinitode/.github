name: Update total downloads badge

# Tallies PyPI + jsDelivr downloads and rewrites the TOTAL-DOWNLOADS badge
# block in profile/README.md.
#
# Data sources (see scripts/update-download-badges.py for details):
#   PyPI     - pepy v2 API when PEPY_API_KEY is set (exact counts), otherwise
#              the shields.io /pepy/dt badge (no key, rounded figures).
#   jsDelivr - shields.io /jsdelivr/gh/hy badge = hits over the last 12 months.
#              jsDelivr publishes period stats only; there is no all-time figure.
#
# Optional but recommended: add a repository secret named PEPY_API_KEY
# (free key: pepy.tech -> sign in -> API key). Without it the job still runs,
# using the rounded shields.io figures instead.
#
# Safety: a failed fetch never overwrites the badge. The job only writes when
# at least one source returned a number, and never publishes a total more than
# 5% below the figure already shown.

on:
  schedule:
    - cron: "17 4 * * *" # 04:17 UTC daily
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/**"
      - ".github/workflows/update-download-badges.yml"
  push:
    branches: [main]
    paths:
      - "scripts/update-download-badges.py"
      - ".github/workflows/update-download-badges.yml"

permissions:
  contents: write

concurrency:
  group: download-badges
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the badge tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      # Pull requests only run the tests above; the badge is rewritten on main.
      - name: Tally downloads and rewrite the badge
        if: github.event_name != 'pull_request'
        env:
          PEPY_API_KEY: ${{ secrets.PEPY_API_KEY }}
        run: |
          if [ -z "$PEPY_API_KEY" ]; then
            echo "::warning::PEPY_API_KEY is not set; PyPI counts will be rounded shields.io figures."
          fi
          python3 scripts/update-download-badges.py --readme profile/README.md

      - name: Commit the updated badge
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/README.md
          if git diff --cached --quiet; then
            echo "Total downloads unchanged; nothing to commit."
          else
            git commit -m "chore: update total downloads badge [skip ci]"
            git push
          fi
